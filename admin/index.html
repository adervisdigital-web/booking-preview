<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex">
<title>Брони: кабинет</title>
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<script src="../demo-api.js"></script>
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="admin.css">
<script src="../pricing.js" defer></script>
<script src="admin.js" defer></script>
</head>
<body>
  <div class="toast" id="toast" role="status"><div class="ic" id="tIc">✓</div><div><b id="tT"></b><span id="tS"></span></div></div>

  <form id="login" class="login" hidden>
    <img class="loginlogo" src="../brand/logo-192.png" alt="" width="96" height="89"><h1 class="brand">БРОНЬ ЗАЛОВ</h1><p class="role">кабинет администратора</p>
    <label class="fld"><i>Логин</i><input id="lLogin" autocomplete="username" required></label>
    <label class="fld"><i>Пароль</i><input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr" role="alert"></p>
    <button class="btn wide">Войти</button>
  </form>

  <div class="admin" id="app" hidden>
    <div class="am">
      <div class="ah"><img class="alogo" src="../brand/logo-96.png" alt="" width="40" height="37"><div class="brand sm" id="aName"></div><span class="role" id="who"></span>
        <div class="qs"><input id="q" type="search" placeholder="Найти гостя: телефон или имя" autocomplete="off" aria-label="Поиск брони по телефону или имени"><div class="qres" id="qres" hidden></div></div>
        <button type="button" class="btn add" id="addBtn">+ Бронь</button></div>
      <div class="dline"><h2 class="dtitle" id="dTitle"></h2>
        <div class="dsel"><button type="button" id="prev" aria-label="Предыдущий день">‹</button><input type="date" id="pick" aria-label="Дата"><button type="button" id="next" aria-label="Следующий день">›</button><button type="button" class="today" id="today">Сегодня</button></div></div>
      <nav class="adays" id="adays" aria-label="Дни: заявки и брони"></nav>
      <div class="kpi"><div class="r"><i>Новые заявки</i><b id="kReq">0</b></div><div><i>Броней на день</i><b id="kB">0</b></div><div><i>Сумма за день</i><b id="kSum">0 ₽</b></div></div>
      <section class="now" id="now" hidden><h3>Сейчас в залах</h3><div class="nowl" id="nowList"></div></section>
      <div class="vt"><div class="seg sm" role="tablist"><button type="button" id="vList">Список</button><button type="button" id="vGrid">Сетка</button></div></div>
      <div class="list" id="list"></div>
      <div id="gridBox"><div class="gridwrap"><div class="grid" id="grid"></div></div>
        <div class="legend"><em class="l1">подтверждено</em><em class="l2">заявка гостя</em><em class="l4">предложено время</em><em class="l3">бронь по телефону</em><span>Пустая клетка: записать бронь</span></div></div>
      <div class="tools"><button type="button" id="repBtn">Отчёт за месяц</button><button type="button" id="statsBtn">Статистика сайта</button><button type="button" id="csv">Выгрузить месяц в таблицу</button><button type="button" id="snd"></button><a href="help.html" target="_blank" rel="noopener">Памятка</a><button type="button" id="out">Выйти</button></div>
    </div>
    <aside class="side"><h2>Заявки <span id="sReq">0</span></h2><div id="reqs"></div>
      <h2 class="h2b">Перезвонить <span id="sCb">0</span></h2><div id="cbs"></div></aside>
    <button type="button" class="fab" id="fab" aria-label="Новая бронь">+</button>
  </div>

  <dialog id="dlg"><div id="dlgBody"></div></dialog>
</body>
</html>
